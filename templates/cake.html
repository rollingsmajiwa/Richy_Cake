{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
  <h1 class="text-2xl font-bold mb-6 text-gray-800">Available Cakes</h1>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    {% for cake in cake_list %}
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-200 border border-gray-100 flex flex-col">
        <a href="{% url 'cake_details' cake.id %}" class="block overflow-hidden group">
          <img 
            src="{{ cake.image.url }}" 
            alt="{{ cake.name }}" 
            class="w-full h-48 object-cover group-hover:scale-105 transition duration-300"
          >
        </a>
        
        <div class="p-4 flex flex-col flex-grow justify-between">
          <div>
            <h2 class="font-bold text-lg text-gray-800 mb-1">{{ cake.name|title }}</h2>
            <p class="text-red-600 font-semibold text-base mb-3">KSH{{ cake.price }}</p>
          </div>
          
          <a href="{% url 'cake_details' cake.id %}" class="inline-block text-center bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition duration-200">
            View Details
          </a>
        </div>
      </div>
    {% empty %}
      <div class="col-span-full text-center py-10">
        <p class="text-gray-500 text-lg">No cakes available yet!</p>
      </div>
    {% endfor %}
  </div> 
</div>
{% endblock %}
