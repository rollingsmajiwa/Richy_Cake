<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Richie Cake {% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        .card{ @apply bg-white border rounded-lg p-6 }
        .btn{ @apply bg-blue-600 text-white px-4 py-2 rounded;}
        input, select, textarea { @apply w-full border rounded px-3 py-2 mb-3 }
        label {@apply block text-sm font-medium }
    </style>
    <style type="text/tailwindcss">
        @theme {
            --color-cake-red: #B82A2A;
            --color-cake-rose: #9E2A2B;
            --color-cake-dark: #2E1C1A;
            --color-cake-taupe: #6E5A56;
            --color-cake-cream: #F8F5EE;
            --color-cake-sand: #E3D8C8;
            --color-cake-choco: #3A2320;
             --color-cake-brown: #8988C;
            
            
            
  }
</style>
</head>
<body class="bg-cake-cream min-h-screen">
    <nav class="w-full bg-cake-red text-white py-2 flex justify-between">
        <a href="{% url 'index_page' %}"><span class="text-white font-black text-xl">Richie</span><span class="text-black font-black text-xl">Cake</span></a>
        <div class=" font-medium text-md">
            <a href="{% url 'register' %}" class="hover:underline mr-5">Sign Up</a>
             <a href="{% url 'login' %}" class="hover:underline mr-1">Sign In</a>
            
        </div>
    </nav>
    <main>
        {% block content %}
        
        {% endblock %}
    </main>
    
</body>
</html>
