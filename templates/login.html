{% extends 'base.html' %}
{% block content %}
<div class="card max-w-sm mx-auto">
    <h1 class="text-xl font-bold mb-4">Sign In</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn">Sign In</button>
        <p>Don't have an account?</p>
        <a href="{% url 'login' %}" class="text-blue-700 underline text-md">Sign Up</a>

    </form>

</div>

{% endblock %}
