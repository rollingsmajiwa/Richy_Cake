{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
  <a href="{% url 'cake_page' %}" class="inline-flex items-center text-sm font-medium text-gray-600 hover:text-red-600 mb-6 transition">
     Back to Available Cakes
  </a>

  <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
    
    <div class="rounded-xl overflow-hidden bg-gray-50 flex items-center justify-center">
      <img 
        src="{{ cake.image.url }}" 
        alt="{{ cake.name }}" 
        class="w-full h-80 md:h-96 object-cover rounded-xl shadow-sm"
      >
    </div>

    <div class="flex flex-col justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ cake.name|title }}</h1>
        <p class="text-2xl font-bold text-red-600 mb-4">KES {{ cake.price }}</p>
        
        <hr class="border-gray-200 mb-4">

        <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-2">Description</h3>
        <p class="text-gray-600 leading-relaxed text-sm md:text-base">
          {% if cake.description %}
            {{ cake.description }}
          {% else %}
            No description available for this cake.
          {% endif %}
        </p>
      </div>

      <div class="mt-8 flex gap-4">
        <a href="{% url 'add_to_cart' cake.id %}" class="flex-1 text-center bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition shadow-md">
          Order Now
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
