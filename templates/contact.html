{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto px-4 py-12 sm:px-6 lg:px-8">
    <h1 class="text-4xl font-extrabold text-red-800 tracking-tight text-center mb-3">Contact Us</h1>
    <p class="text-gray-600 text-center mb-8">Have questions or custom event specifications? Drop us a line below.</p>
    
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none" placeholder="Enter your name" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none" placeholder="eg. rollinsmajiwa@gmail.com" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none" placeholder="How can we help you?" required></textarea>
            </div>
            <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-2.5 rounded-lg transition duration-200">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
