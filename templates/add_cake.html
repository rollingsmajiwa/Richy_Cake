{% extends 'base.html' %}
{% block content %}
<div class="card max-w-sm mx-auto my-8 p-6 bg-white rounded-xl shadow-md border border-gray-100">
    <h1 class="text-2xl font-bold mb-4 text-gray-800 mb-6 text-center">Add a Cake</h1>
    <form method="POST", enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn">Add Cake</button>

    </form>

</div>

{% endblock %}
